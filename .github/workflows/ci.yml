name: PulsePilot CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/flagsmith-production-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulsepilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, deterministic tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run lint

      - name: Run deterministic unit and persistence tests
        run: npm test

      - name: Build production application
        run: npm run build
